# The three demos published on the Pages site, simplest first. All run in
# coarse 500ms time so each viz step is one readable quantum, and writers
# outlast any recording so Have timers keep being armed.
defaults:
  seeds: 1
  duration_ms: 3600000
  sample_interval_ms: 1000

scenarios:
  # One writer at the end of a line: a Want travels out, the Have comes back.
  line-5:
    nodes: 5
    topology: { kind: path }
    loss: 0.0
    latency_ms: { distribution: log-normal, median_ms: 3.0, sigma: 0.6 }
    router: { want_ttl_ms: 4000, have_ttl_ms: 4000 }
    storage: { relay_cap: 1048576 }
    policy:
      want: { kind: fixed, min_ms: 2000, max_ms: 6000 }
      have: { kind: fixed, min_ms: 500, max_ms: 3000 }
    workload: { writers: 1, appends_per_sec: 0.1 }
    time_quantum_ms: 500

  # Three in a line losing 30% of messages, written to slowly enough that
  # each gap plays out alone. A line has one route, so a lost push leaves
  # everyone downstream with a gap that only a Want and its repair Have can
  # fill. Timers and TTLs are short so a heal fits in a few steps; the
  # site records seed 26 (see the justfile), where the first two pushes
  # are lost and each heals within six steps.
  line-3-lossy:
    nodes: 3
    topology: { kind: path }
    loss: 0.3
    latency_ms: { distribution: log-normal, median_ms: 3.0, sigma: 0.6 }
    router: { want_ttl_ms: 1000, have_ttl_ms: 1000 }
    storage: { relay_cap: 1048576 }
    policy:
      want: { kind: fixed, min_ms: 1000, max_ms: 2000 }
      have: { kind: fixed, min_ms: 500, max_ms: 1000 }
    workload: { writers: 1, appends_per_sec: 0.1 }
    time_quantum_ms: 500

  # A small LAN losing 15% of messages: many timers at once, Wants
  # suppressing each other, repair traffic under loss.
  lan-20:
    nodes: 20
    topology: { kind: random-tree, extra_edges: 0.2 }
    loss: 0.15
    latency_ms: { distribution: log-normal, median_ms: 3.0, sigma: 0.6 }
    router: { want_ttl_ms: 4000, have_ttl_ms: 4000 }
    storage: { relay_cap: 1048576 }
    policy:
      want: { kind: density-scaled, min_ms: 1000, max_ms: 10000, ref_n: 20 }
      have: { kind: fixed, min_ms: 500, max_ms: 10000 }
    workload: { writers: 4, appends_per_sec: 0.5 }
    time_quantum_ms: 500
