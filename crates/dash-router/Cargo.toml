[package]
name = "dash-router"
description = "The tokio shell: a real Dash Router node over async storage and a LAN transport"
version.workspace = true
edition.workspace = true

[features]
p2panda = ["dep:p2panda-net", "dep:p2panda-core", "dep:futures-util"]

[dependencies]
dash-router-core = { path = "../dash-router-core" }
dash-router-policy = { path = "../dash-router-policy" }
polestar = { workspace = true }
anyhow = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
trait-variant = "0.1"
tracing = "0.1"
redb = "4.3.0"
p2panda-net = { version = "0.7", optional = true }
p2panda-core = { version = "0.7", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
proptest = { workspace = true }
rand_chacha = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }
tempfile = "3"
